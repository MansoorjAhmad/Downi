name: Test — Engine Smoke + Debug Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Extraction smoke test (READ_THIS matrix, CI tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve pinned yt-dlp from build.gradle (Single Source of Truth)
        id: ytdlp-pin
        run: |
          PIN=$(python ci/verify_pin_parity.py --print-pin)
          echo "pin=$PIN" >> $GITHUB_OUTPUT
          echo "Resolved engine pin: $PIN"
      - name: Install engine deps
        run: pip install ${{ steps.ytdlp-pin.outputs.pin }}
      - name: Verify engine pin parity & SHA-256 integrity (drift guard)
        run: python ci/verify_pin_parity.py
      - name: Verify version parity & single source of truth (drift guard)
        run: python ci/verify_version_parity.py
      - name: Run engine smoke test
        env:
          PYTHONIOENCODING: utf-8
        run: python ci/smoke_test.py

  build:
    name: Debug APK build (exercises the bundled-UI freshness guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci || npm install
      - run: npx cap sync android
      - name: "Tab state gate (one view, one nav per switch)"
        run: node tools/_tabcheck.js
      - name: "JVM unit tests"
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --console=plain
      - name: Build debug APK (unsigned)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
