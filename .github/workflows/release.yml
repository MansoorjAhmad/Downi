name: Release DOWNI APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Web Assets into Android
        run: npx cap sync android

      - name: Restore Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/omni-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=$(pwd)/android/omni-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "DOWNI-${GITHUB_REF_NAME}.apk"
          ls -la DOWNI-*.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # The tagged commit's message doubles as the release notes, so
          # "release: vX.Y.Z ..." commits publish with correct notes instead
          # of a stale hardcoded blurb (workflow_dispatch has no head_commit).
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$NOTES" ]; then
            NOTES="DOWNI ${TAG} release. Install directly over the previous version — the signing key is unchanged, so your settings and downloads are preserved."
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "DOWNI-${TAG}.apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "DOWNI-${TAG}.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DOWNI ${TAG}" \
              --notes "$NOTES"
          fi
