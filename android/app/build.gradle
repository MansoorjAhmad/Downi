apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            // Pinned on purpose: extractor fixes for Instagram/YouTube/TikTok ship
            // through yt-dlp releases, so bump this deliberately (monthly cadence,
            // or immediately when a platform breaks) — and every bump is an
            // extraction-layer change: READ_THIS_BEFORE_UPGRADE.md's full device
            // matrix applies before release.
            install("yt-dlp==2026.8.19")
            install("certifi")
        }
    }
}

// Signing: read from android/keystore.properties (gitignored) or environment
// variables (CI). Never hardcode credentials in this file.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def ksStoreFile = System.getenv("KEYSTORE_FILE") ?: keystoreProps.getProperty("storeFile")
def ksStorePassword = System.getenv("KEYSTORE_PASSWORD") ?: keystoreProps.getProperty("storePassword")
def ksKeyAlias = System.getenv("KEY_ALIAS") ?: keystoreProps.getProperty("keyAlias")
def ksKeyPassword = System.getenv("KEY_PASSWORD") ?: keystoreProps.getProperty("keyPassword")
def releaseSigningAvailable = ksStoreFile != null && file(ksStoreFile).exists()

android {
    namespace "com.omnidownloader.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.omnidownloader.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        versionCode 42
        versionName "3.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningAvailable) {
            release {
                storeFile file(ksStoreFile)
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // Standard Android debug keystore
        }
    }
}

// --- Bundled-UI freshness guard -------------------------------------------------
// The APK serves src/main/assets/public/, which is a byte-copy of ../../www
// refreshed by `npx cap sync android`. Local builds that skip the sync used to
// silently ship an outdated UI (this actually shipped a stale debug APK once).
// Refuse to build in that case so it can never happen again.
tasks.named('preBuild') {
    doFirst {
        def wwwIndex = new File(rootProject.projectDir.parentFile, 'www/index.html')
        def bundledIndex = file('src/main/assets/public/index.html')
        if (!wwwIndex.exists()) {
            throw new GradleException("www/index.html not found at ${wwwIndex.absolutePath}. Run `npx cap sync android` from the repo root.")
        }
        if (!bundledIndex.exists() || !java.util.Arrays.equals(wwwIndex.bytes, bundledIndex.bytes)) {
            throw new GradleException("Bundled web UI is stale: assets/public/index.html differs from www/index.html. Run `npx cap sync android` from the repo root, then rebuild.")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

configurations.configureEach {
    exclude group: 'androidx.annotation', module: 'annotation-jvm'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
