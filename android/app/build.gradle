apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'com.chaquo.python'

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            // Pinned on purpose: extractor fixes for Instagram/YouTube/TikTok ship
            // through yt-dlp releases, so bump this deliberately (monthly cadence,
            // or immediately when a platform breaks).
            //
            // Wheel artifact SHA-256: d9efc48001599179033cf97b9cb2c268be52eea10d068cb7a54e19f70aed7bf8
            // Rollback pin: install("yt-dlp==2026.11.4.232659.dev0")
            install("yt-dlp==2026.11.24.232653.dev0")
            // Wheel artifact SHA-256: e9b54de76e530bb6cf0ccd036787103acb58fd42ba930ea8bf948ddbaa2f61d1
            install("certifi==2026.10.23")
        }
    }
}

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def ksStoreFile = System.getenv("KEYSTORE_FILE") ?: keystoreProps.getProperty("storeFile")
def ksStorePassword = System.getenv("KEYSTORE_PASSWORD") ?: keystoreProps.getProperty("storePassword")
def ksKeyAlias = System.getenv("KEY_ALIAS") ?: keystoreProps.getProperty("keyAlias")
def ksKeyPassword = System.getenv("KEY_PASSWORD") ?: keystoreProps.getProperty("keyPassword")
def releaseSigningAvailable = ksStoreFile != null && file(ksStoreFile).exists()

android {
    namespace "com.omnidownloader.app"
    compileSdk rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = libs.versions.composeCompiler.get()
    }

    defaultConfig {
        applicationId "com.omnidownloader.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        versionCode 67
        versionName "4.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        if (releaseSigningAvailable) {
            release {
                storeFile file(ksStoreFile)
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }

    buildTypes {
        release {
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.splashscreen
    implementation libs.androidx.activity.compose

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons
    implementation libs.haze
    debugImplementation libs.androidx.compose.ui.tooling

    implementation libs.androidx.navigation.compose
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose

    implementation libs.kotlinx.coroutines.android

    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    implementation libs.androidx.datastore.preferences
    implementation libs.androidx.work.runtime.ktx

    implementation libs.okhttp
    implementation libs.coil.compose
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.ui

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
